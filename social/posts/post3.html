<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Post 3 - Testimonial</title>
  <style>
    html,body{height:100%;margin:0}
    .card{width:1080px;height:1080px;position:relative;font-family:Arial,Helvetica,sans-serif}
    .bg{position:absolute;inset:0;background-image:url('../../img/austin-ramsey-IvzvlKQwjk8-unsplash.jpg');background-size:cover;background-position:center}
    .overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.36),rgba(0,0,0,0.02))}
    .quote{position:absolute;left:60px;right:60px;top:36%;text-align:center;color:#fff;font-size:44px;font-weight:700;line-height:1.1}
    .author{position:absolute;left:60px;right:60px;top:62%;text-align:center;color:#fff;font-size:20px}
    .note{position:absolute;right:18px;bottom:18px;color:#fff;background:rgba(0,0,0,0.25);padding:8px 10px;border-radius:6px}
  </style>
</head>
<body>
  <div class="card">
    <div class="bg"></div>
    <div class="overlay"></div>
    <div class="quote">“Fantastic workmanship and on time”</div>
    <div class="author">— happy client</div>
    <div class="note">Peak Carpenters • #furniture</div>
  </div>
</body>
</html>
