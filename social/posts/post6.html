<!doctype html>
<html>

</head>
<body>

    <div class="title">Meet the Team</div>
    <div class="grid">
      <div class="member"><div class="avatar"></div><div class="meta">John • Carpenter</div></div>
      <div class="member"><div class="avatar"></div><div class="meta">Maria • Designer</div></div>
      <div class="member"><div class="avatar"></div><div class="meta">Lee • Installer</div></div>
      <div class="member"><div class="avatar"></div><div class="meta">Ana • Project Lead</div></div>
    </div>

</html>
